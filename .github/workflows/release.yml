name: Release CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"

          - platform: windows-latest
            args: ""

          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      # ----------------------------------------
      # Checkout
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # ----------------------------------------
      # Node & pnpm
      # ----------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_ENV"

      - name: Cache pnpm modules
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('apps/desktop/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # ----------------------------------------
      # Rust
      # ----------------------------------------
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Cargo Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      # ----------------------------------------
      # Linux dependencies
      # ----------------------------------------
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # ----------------------------------------
      # Frontend dependencies
      # ----------------------------------------
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # ----------------------------------------
      # Build MCP Filesystem Server
      # ----------------------------------------
      - name: Build MCP Filesystem Server
        shell: bash
        run: |
          set -euo pipefail

          RESOURCE_DIR="apps/desktop/src-tauri/resources/filesystem"

          mkdir -p "$RESOURCE_DIR"

          if [ "${{ matrix.platform }}" = "macos-latest" ]; then

            echo "Building macOS universal MCP server"

            cargo build --release -p filesystem --target x86_64-apple-darwin
            cargo build --release -p filesystem --target aarch64-apple-darwin

            mkdir -p "$RESOURCE_DIR/macos"

            lipo -create \
              target/x86_64-apple-darwin/release/filesystem \
              target/aarch64-apple-darwin/release/filesystem \
              -output "$RESOURCE_DIR/macos/filesystem"

            chmod +x "$RESOURCE_DIR/macos/filesystem"

          elif [ "${{ matrix.platform }}" = "windows-latest" ]; then

            echo "Building Windows MCP server"

            cargo build --release -p filesystem

            mkdir -p "$RESOURCE_DIR/windows"

            cp target/release/filesystem.exe \
              "$RESOURCE_DIR/windows/filesystem.exe"

          else

            echo "Building Linux MCP server"

            cargo build --release -p filesystem

            mkdir -p "$RESOURCE_DIR/linux"

            cp target/release/filesystem \
              "$RESOURCE_DIR/linux/filesystem"

            chmod +x "$RESOURCE_DIR/linux/filesystem"

          fi

          echo "MCP resource contents:"
          find "$RESOURCE_DIR" -type f

      # ----------------------------------------
      # Verify MCP resource exists
      # ----------------------------------------
      - name: Verify MCP Filesystem Server
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.platform }}" in
            macos-latest)
              test -f apps/desktop/src-tauri/resources/filesystem/macos/filesystem
              ;;
            windows-latest)
              test -f apps/desktop/src-tauri/resources/filesystem/windows/filesystem.exe
              ;;
            ubuntu-22.04)
              test -f apps/desktop/src-tauri/resources/filesystem/linux/filesystem
              ;;
          esac

          echo "MCP filesystem resource verified."

      # ----------------------------------------
      # Verify build (Pull Requests)
      # ----------------------------------------
      - name: Verify Tauri build
        if: github.event_name == 'pull_request'
        working-directory: apps/desktop
        run: pnpm exec tauri build ${{ matrix.args }}
        env:
          HARNESS_MODEL_API_KEY: ${{ secrets.HARNESS_MODEL_API_KEY }}
          HARNESS_MODEL_NAME: ${{ secrets.HARNESS_MODEL_NAME }}

      # ----------------------------------------
      # Production build and release
      # ----------------------------------------
      - name: Build frontend and Tauri application
        uses: tauri-apps/tauri-action@v0
        if: github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HARNESS_MODEL_API_KEY: ${{ secrets.HARNESS_MODEL_API_KEY }}
          HARNESS_MODEL_NAME: ${{ secrets.HARNESS_MODEL_NAME }}
        with:
          projectPath: apps/desktop
          tagName: app-v__VERSION__
          releaseName: "Defendrite Workbench v__VERSION__"
          releaseBody: "Automated release from GitHub Actions."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
