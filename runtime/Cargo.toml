[package]
name = "runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
models = { path = "../models" }
tokio = { version = "1", features = ["full"] }
tauri = { version = "2", features = [] } 
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json", "stream"] }
tauri-plugin-store = "2"
rusqlite = { version = "0.41.1", features = ["bundled-sqlcipher"] }
