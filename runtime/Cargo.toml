[package]
name = "runtime"
version = "1.0.0"
edition = "2021"

[dependencies]
models = { path = "../models" }
tokio = { version = "1", features = ["full"] }
tauri = { version = "2", features = [] } 
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
tauri-plugin-store = "2"
rusqlite = { version = "0.41.1", features = ["bundled-sqlcipher-vendored-openssl"] }
uuid = { version = "1.29.0", features = ["v4"] }
futures-util = "0.3"
bytes = "1"
rmcp = { version = "3.8.0", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
serde_yaml = "0.9.34"
chrono = { version = "0.4.45", features = ["serde"] }
url = "2"
base64 = "0.23.1"