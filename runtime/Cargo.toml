[package]
name = "runtime"
version = "0.3.5"
edition = "2021"

[dependencies]
models = { path = "../models" }
tokio = { version = "1", features = ["full"] }
tauri = { version = "2", features = [] } 
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
tauri-plugin-store = "2"
rusqlite = { version = "0.41.1", features = ["bundled-sqlcipher-vendored-openssl"] }
uuid = { version = "1.29.0", features = ["v4"] }
futures-util = "0.3"
bytes = "1"